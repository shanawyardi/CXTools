<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Res Leadership Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ── CX Tools design system tokens ── */
:root {
  --ys-font-ui: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ys-primary-100: rgb(224,240,252);
  --ys-primary-200: rgb(179,214,241);
  --ys-primary-400: rgb(42,160,255);
  --ys-primary-500: rgb(0,114,206);
  --ys-primary-600: rgb(0,46,82);
  --ys-primary-700: rgb(0,80,144);
  --ys-primary-800: rgb(0,63,120);
  --ys-secondary-100: rgb(245,245,245);
  --ys-secondary-200: rgb(198,198,198);
  --ys-secondary-300: rgb(128,129,132);
  --ys-secondary-400: rgb(112,112,112);
  --ys-secondary-500: rgb(78,78,78);
  --ys-secondary-600: rgb(32,32,32);
  --ys-success-100: rgb(213,241,231);
  --ys-success-300: rgb(33,181,132);
  --ys-success-500: rgb(14,92,67);
  --ys-success-700: rgb(23,127,92);
  --ys-warning-100: rgb(255,240,200);
  --ys-warning-300: rgb(255,187,0);
  --ys-warning-700: rgb(117,79,0);
  --ys-orange-100: rgb(255,220,200);
  --ys-orange-500: rgb(255,91,39);
  --ys-orange-600: rgb(128,42,14);
  --ys-info-100: rgb(206,238,250);
  --ys-info-400: rgb(0,189,255);
  --ys-info-500: rgb(48,161,255);
  --ys-info-700: rgb(0,132,179);
  --ys-danger-100: rgb(252,220,220);
  --ys-danger-500: rgb(208,11,0);
  --ys-danger-700: rgb(163,9,0);
  --ys-purple-deep: rgb(130,70,175);
  --ys-bg-app:      rgb(251,251,251);
  --ys-bg-surface:  rgb(255,255,255);
  --ys-bg-sunken:   rgb(245,245,245);
  --ys-bg-hover:    rgba(0,0,0,0.04);
  --ys-bg-selected: rgba(0,114,206,0.08);
  --ys-fg-primary:   rgba(0,0,0,0.87);
  --ys-fg-secondary: rgba(0,0,0,0.60);
  --ys-fg-tertiary:  rgba(0,0,0,0.48);
  --ys-fg-disabled:  rgba(0,0,0,0.32);
  --ys-fg-inverse:   rgb(255,255,255);
  --ys-fg-link:      rgb(0,114,206);
  --ys-border-subtle:  rgb(233,233,233);
  --ys-border-default: rgb(206,212,218);
  --ys-border-strong:  rgba(0,0,0,0.32);
  --ys-border-primary: rgb(0,114,206);
  --ys-border-focus:   rgb(0,132,241);
  --ys-tint-primary-1: rgba(0,114,206,0.08);
  --ys-tint-primary-2: rgba(0,114,206,0.12);
  --ys-tint-info-1: rgba(0,189,255,0.08);
  --ys-tint-success-1: rgba(33,181,132,0.08);
  --ys-tint-warning-1: rgba(255,187,0,0.08);
  --ys-tint-danger-1: rgba(208,11,0,0.08);
  --ys-shadow-sm: 0 2px 4px 0 rgba(0,0,0,0.08);
  --ys-shadow-md: 0 4px 16px 0 rgba(0,0,0,0.24), 0 0 2px 0 rgba(0,0,0,0.12);
  --ys-shadow-lg: 0 16px 32px 2px rgba(0,0,0,0.24);
  --ys-radius-xs: 2px;
  --ys-radius-sm: 4px;
  --ys-radius-md: 8px;
  --ys-radius-lg: 12px;
  --ys-radius-pill: 100px;
  --ys-text-xs: 11px;
  --ys-text-sm: 12px;
  --ys-text-base: 14px;
  --ys-text-md: 16px;
  --ys-text-lg: 18px;
  --ys-height-navbar: 64px;
  --ys-space-1: 4px;
  --ys-space-2: 8px;
  --ys-space-3: 12px;
  --ys-space-4: 16px;
  --ys-space-5: 20px;
  --ys-space-6: 24px;
  --ys-space-8: 32px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--ys-font-ui); font-size: var(--ys-text-base); color: var(--ys-fg-primary); background: var(--ys-bg-app); min-height: 100vh; }

/* ── Top bar ── */
.ys-topbar {
  display: flex; align-items: center; height: var(--ys-height-navbar);
  padding: 0 15px;
  background: linear-gradient(to right, var(--ys-primary-500), rgb(0,133,241) 90%, var(--ys-primary-500)) no-repeat;
  gap: var(--ys-space-4); position: sticky; top: 0; z-index: 100;
}
.ys-topbar-product { font-family: var(--ys-font-ui); font-weight: 400; font-size: 22px; color: rgba(255,255,255,0.95); letter-spacing: -0.01em; }
.ys-topbar-sub { font-size: 16px; color: rgba(255,255,255,0.65); margin-left: 2px; }
.ys-topbar-spacer { flex: 1; }
.ys-tabs-pill { display: inline-flex; height: 30px; background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.20); border-radius: var(--ys-radius-md); padding: 2px; overflow: hidden; }
.ys-tabs-pill .ys-tab { height: 100%; min-height: 0; padding: 0 14px; border: none; border-radius: var(--ys-radius-sm); background: transparent; font-family: var(--ys-font-ui); font-size: var(--ys-text-sm); font-weight: 600; color: rgba(255,255,255,0.75); cursor: pointer; white-space: nowrap; transition: all 0.12s; }
.ys-tabs-pill .ys-tab:hover { color: #fff; background: rgba(255,255,255,0.10); }
.ys-tabs-pill .ys-tab-active { background: #fff; color: var(--ys-primary-600); }

/* ── Page header (search + filters) ── */
.ys-page-header {
  display: flex; align-items: center; gap: var(--ys-space-4);
  min-height: 52px; padding: 10px 20px;
  background: var(--ys-bg-surface);
  border-bottom: 1px solid var(--ys-border-subtle);
  box-shadow: var(--ys-shadow-sm);
  flex-wrap: wrap;
}
.ys-tbar-search { position: relative; }
.ys-tbar-search i { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--ys-fg-tertiary); font-size: 13px; pointer-events: none; }
.ys-tbar-search input { height: 32px; width: 260px; border: 1px solid var(--ys-border-default); border-radius: var(--ys-radius-md); padding: 0 var(--ys-space-3) 0 28px; font-family: var(--ys-font-ui); font-size: var(--ys-text-base); color: var(--ys-fg-primary); background: var(--ys-bg-surface); outline: none; }
.ys-tbar-search input:focus { border-color: var(--ys-border-focus); }
.ys-tbar-search input::placeholder { color: var(--ys-fg-tertiary); font-size: 13px; }
.chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
.ys-chip-select { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border: 1px solid var(--ys-border-default); border-radius: var(--ys-radius-pill); background: var(--ys-bg-surface); font-family: var(--ys-font-ui); font-size: var(--ys-text-sm); font-weight: 600; color: var(--ys-fg-secondary); cursor: pointer; white-space: nowrap; transition: all 0.1s; }
.ys-chip-select:hover { background: var(--ys-bg-sunken); }
.ys-chip-select-active { background: rgba(0,189,255,0.08); border-color: rgb(0,189,255); color: var(--ys-fg-primary); }

/* ── Content area ── */
.ys-page-content { padding: var(--ys-space-5) var(--ys-space-5) 48px; }
.section-label {
  font-size: var(--ys-text-xs); font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--ys-fg-tertiary);
  padding-bottom: 8px; margin: var(--ys-space-5) 0 var(--ys-space-3);
  border-bottom: 1px solid var(--ys-border-subtle);
  display: flex; align-items: center; gap: 8px;
}
.section-count { font-size: var(--ys-text-sm); font-weight: 400; color: var(--ys-fg-tertiary); text-transform: none; letter-spacing: 0; }

/* ── Card grid ── */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 10px; margin-bottom: 8px; }
.dir-card {
  background: var(--ys-bg-surface);
  border: 1px solid var(--ys-border-subtle);
  border-radius: var(--ys-radius-md);
  box-shadow: var(--ys-shadow-sm);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.dir-card:hover { border-color: var(--ys-border-primary); box-shadow: 0 2px 10px rgba(0,114,206,0.12); }
.card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

/* avatar */
.ys-av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-family: var(--ys-font-ui); font-weight: 600; flex-shrink: 0; position: relative; overflow: hidden; text-transform: uppercase; }
.ys-av-md { width: 36px; height: 36px; min-width: 36px; font-size: 13px; }
.ys-av-sm { width: 30px; height: 30px; min-width: 30px; font-size: 11px; }
.ys-av-xs { width: 22px; height: 22px; min-width: 22px; font-size: 9px; }
.ys-av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
.ys-av .ini { position: relative; z-index: 1; }
/* avatar color variants */
.av-president { background: var(--ys-primary-600); color: #fff; }
.av-svp       { background: var(--ys-primary-500); color: #fff; }
.av-evp       { background: var(--ys-primary-700); color: #fff; }
.av-vp        { background: var(--ys-tint-primary-2); color: var(--ys-primary-700); }
.av-lead      { background: var(--ys-tint-info-1); color: var(--ys-info-700); }
.av-ip        { background: var(--ys-tint-warning-1); color: var(--ys-warning-700); }
.av-ae        { background: var(--ys-tint-success-1); color: var(--ys-success-700); }
.av-s         { background: var(--ys-bg-sunken); color: var(--ys-fg-secondary); }

.card-name { font-size: var(--ys-text-base); font-weight: 600; color: var(--ys-fg-primary); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-role { font-size: var(--ys-text-sm); color: var(--ys-fg-secondary); margin-top: 1px; }
.card-links { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.card-ec { font-size: var(--ys-text-xs); color: var(--ys-fg-link); text-decoration: none; font-weight: 500; }
.card-ec:hover { text-decoration: underline; }
.card-ico { color: var(--ys-fg-tertiary); text-decoration: none; display: inline-flex; align-items: center; font-size: 12px; transition: color 0.1s; }
.card-ico:hover { color: var(--ys-primary-500); }

.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--ys-radius-pill); font-size: var(--ys-text-xs); font-weight: 600; white-space: nowrap; }
.tag-west      { background: rgba(33,181,132,0.10); color: var(--ys-success-700); }
.tag-central   { background: rgba(255,187,0,0.12); color: var(--ys-warning-700); }
.tag-northeast { background: var(--ys-tint-primary-1); color: var(--ys-primary-700); }
.tag-southeast { background: rgba(208,11,0,0.08); color: var(--ys-danger-700); }
.tag-product   { background: var(--ys-tint-info-1); color: var(--ys-info-700); border: 1px solid rgba(0,189,255,0.20); }
.tag-more      { background: var(--ys-bg-sunken); color: var(--ys-fg-secondary); }

/* ── Org chart ── */
.org-wrap { padding: var(--ys-space-5); }
.org-leader-card {
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--ys-bg-surface); border: 1px solid var(--ys-border-default);
  border-left: 3px solid var(--ys-primary-500);
  border-radius: var(--ys-radius-md); padding: 10px 16px 10px 13px;
  text-decoration: none; color: inherit; margin-bottom: 10px;
  box-shadow: var(--ys-shadow-sm); transition: border-color 0.12s, box-shadow 0.12s;
}
.org-leader-card:hover { border-color: var(--ys-border-primary); border-left-color: var(--ys-primary-700); box-shadow: 0 2px 10px rgba(0,114,206,0.12); }
.org-leader-name { font-size: var(--ys-text-base); font-weight: 600; color: var(--ys-fg-primary); }
.org-leader-title { font-size: var(--ys-text-xs); color: var(--ys-primary-500); font-weight: 600; margin-top: 2px; }
.org-leader-products { font-size: var(--ys-text-xs); color: var(--ys-fg-tertiary); margin-top: 1px; }
.org-reports { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 20px; border-left: 2px solid var(--ys-border-subtle); margin-left: 16px; margin-bottom: 24px; }
.org-report-card {
  display: flex; align-items: center; gap: 10px;
  background: var(--ys-bg-surface); border: 1px solid var(--ys-border-subtle);
  border-radius: var(--ys-radius-md); padding: 9px 13px;
  text-decoration: none; color: inherit; box-shadow: var(--ys-shadow-sm);
  transition: border-color 0.12s;
}
.org-report-card:hover { border-color: var(--ys-border-primary); }
.org-report-name { font-size: var(--ys-text-sm); font-weight: 600; color: var(--ys-fg-primary); }
.org-report-detail { font-size: var(--ys-text-xs); color: var(--ys-fg-tertiary); margin-top: 1px; }

/* ── Ownership matrix ── */
.matrix-wrap { padding: var(--ys-space-5); overflow-x: auto; }
.matrix-table { width: 100%; border-collapse: collapse; font-size: var(--ys-text-sm); min-width: 760px; }
.matrix-table th { background: var(--ys-primary-600); color: rgba(255,255,255,0.90); font-size: var(--ys-text-xs); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.20); text-align: left; white-space: nowrap; }
.matrix-table td { padding: 9px 12px; border: 1px solid var(--ys-border-subtle); vertical-align: top; background: var(--ys-bg-surface); }
.matrix-table td:first-child { font-weight: 600; font-size: var(--ys-text-sm); background: var(--ys-bg-sunken); white-space: nowrap; min-width: 175px; color: var(--ys-fg-primary); }
.matrix-table tr:hover td { background: rgba(0,114,206,0.03); }
.matrix-table tr:hover td:first-child { background: var(--ys-tint-primary-1); }
.matrix-person { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.matrix-link { color: var(--ys-fg-link); text-decoration: none; font-size: var(--ys-text-sm); font-weight: 500; white-space: nowrap; line-height: 1.4; }
.matrix-link:hover { text-decoration: underline; }
.matrix-divider td { background: var(--ys-primary-600) !important; color: rgba(255,255,255,0.80) !important; font-size: var(--ys-text-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 7px 12px; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--ys-fg-tertiary); font-size: var(--ys-text-base); }

.view-panel { display: none; }
.view-panel.active { display: block; }

/* ── Multi-select ── */
.dir-card.selected {
  border-color: var(--ys-border-primary);
  background: var(--ys-bg-selected);
  box-shadow: 0 0 0 2px rgba(0,114,206,0.20), var(--ys-shadow-sm);
}
.card-check {
  position: absolute; top: 10px; right: 10px;
  width: 18px; height: 18px;
  border: 2px solid var(--ys-border-default);
  border-radius: 3px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: transparent;
  transition: all 0.1s;
  flex-shrink: 0;
}
.dir-card.selected .card-check {
  background: var(--ys-primary-500);
  border-color: var(--ys-primary-500);
  color: #fff;
}
.dir-card { position: relative; }

/* Sticky action bar */
.sel-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--ys-primary-600);
  border-top: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 -4px 16px rgba(0,0,0,0.24);
  display: flex; align-items: center; gap: var(--ys-space-4);
  padding: 14px 20px;
  transform: translateY(100%);
  transition: transform 0.2s cubic-bezier(0.16,1,0.3,1);
}
.sel-bar.visible { transform: translateY(0); }
.sel-count-label { font-size: var(--ys-text-sm); font-weight: 600; color: rgba(255,255,255,0.80); white-space: nowrap; }
.sel-count-label strong { color: #fff; font-size: var(--ys-text-base); }
.sel-bar-spacer { flex: 1; }
.sel-btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 16px;
  border-radius: var(--ys-radius-md);
  font-family: var(--ys-font-ui); font-size: var(--ys-text-sm); font-weight: 600;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background 0.12s;
}
.sel-btn-primary {
  background: #fff; color: var(--ys-primary-600); border: none;
}
.sel-btn-primary:hover { background: rgba(255,255,255,0.88); }
.sel-btn-ghost {
  background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25);
}
.sel-btn-ghost:hover { background: rgba(255,255,255,0.20); }
.sel-btn-clear {
  background: transparent; color: rgba(255,255,255,0.65); border: none; padding: 0 8px;
}
.sel-btn-clear:hover { color: #fff; }
</style>
</head>
<body>

<!-- Top bar -->
<nav class="ys-topbar">
  <div>
    <div class="ys-topbar-product">Res Leadership Directory</div>
    <div class="ys-topbar-sub">CX Partners in Sales and Services</div>
  </div>
  <div class="ys-topbar-spacer"></div>
  <div class="ys-tabs-pill">
    <button class="ys-tab ys-tab-active" onclick="setView('cards',this)">Directory</button>

</div>

<!-- Sticky multi-select action bar -->
<div class="sel-bar" id="sel-bar">

</div>

<!-- Views -->
<div id="panel-cards" class="view-panel active"><div class="ys-page-content" id="cards-content"></div></div>
<div id="panel-org" class="view-panel"><div class="org-wrap" id="org-content"></div></div>
<div id="panel-matrix" class="view-panel"><div class="matrix-wrap" id="matrix-content"></div></div>

const matrixProducts = [
  'CORE/Voyager','RentCafé','CRM Flex/IQ','Chat IQ','YLD/Blue Moon',
  'Revenue IQ','Forecast IQ','Data Connect','Asset IQ','Screening',
  'Insurance','Yardi Call Center','RentCafé Rewards & Renter Essentials',
  'RentCafé Marketing/Websites','RentCafé REACH','Affordable','PHA',
  'Payments','Military','Student','YES Energy','Procure to Pay','Virtuoso'
];
const REGIONS = ['West','Central','Northeast','Southeast'];
let activeFilter = 'all';
let selected = new Set(); // stores email strings of selected people

function toggleSelect(emailAddr, cardEl, ev) {
  ev.stopPropagation();
  if (selected.has(emailAddr)) {
    selected.delete(emailAddr);
    cardEl.classList.remove('selected');
  } else {
    selected.add(emailAddr);
    cardEl.classList.add('selected');
  }
  updateSelBar();
}

function updateSelBar() {
  const bar = document.getElementById('sel-bar');
  document.getElementById('sel-count').textContent = selected.size;
  bar.classList.toggle('visible', selected.size > 0);
}

function clearSelection() {
  selected.clear();
  document.querySelectorAll('.dir-card.selected').forEach(c => c.classList.remove('selected'));
  updateSelBar();
}

function groupEmail() {
  if (!selected.size) return;
  window.location.href = 'mailto:' + [...selected].join(',');
}

function groupTeams() {
  if (!selected.size) return;
  window.open('https://teams.microsoft.com/l/chat/0/0?users=' + [...selected].join(','), '_blank');
}

function email(p) { return p.email + DOMAIN; }
function photo(p) { return GRAPH.replace('EMAIL', email(p)); }
function ecUrl(id) { return EC + id; }
function teamsUrl(p) { return 'https://teams.microsoft.com/l/chat/0/0?users=' + email(p); }
function ini(name) { return name.split(' ').filter(Boolean).slice(0,2).map(n=>n[0]).join('').toUpperCase(); }

function avClass(p) {
  const t = p.tier;
  if (t === 'President') return 'av-president';
  if (t === 'SVP') return 'av-svp';
  if (t === 'EVP') return 'av-evp';
  if (t === 'VP') return 'av-vp';
  if (t === 'IP') return 'av-ip';
  if (t === 'AE') return 'av-ae';
  if (t === 'Lead') return 'av-lead';
  return 'av-s';
}

function avatarEl(p, sz) {
  const sizeClass = sz === 'md' ? 'ys-av-md' : sz === 'sm' ? 'ys-av-sm' : 'ys-av-xs';
  return `<div class="ys-av ${sizeClass} ${avClass(p)}">
    <img src="${photo(p)}" alt="${p.name}" loading="lazy" onerror="this.remove()" onload="this.style.opacity=1">
    <span class="ini">${ini(p.name)}</span>
  </div>`;
}

function regionTagClass(r) {
  return {West:'tag-west',Central:'tag-central',Northeast:'tag-northeast',Southeast:'tag-southeast'}[r]||'tag-more';
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.ys-chip-select').forEach(c => c.classList.remove('ys-chip-select-active'));
  el.classList.add('ys-chip-select-active');
  render();
}

function setView(v, el) {
  document.querySelectorAll('.ys-tab').forEach(t => t.classList.remove('ys-tab-active'));
  el.classList.add('ys-tab-active');
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + v).classList.add('active');
  document.getElementById('header-bar').style.display = v === 'cards' ? '' : 'none';
  if (v === 'org') renderOrg();
  if (v === 'matrix') renderMatrix();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = people.filter(p => {
    const mQ = !q || p.name.toLowerCase().includes(q) || p.products.some(pr => pr.toLowerCase().includes(q)) || p.role.toLowerCase().includes(q);
    const mF = activeFilter === 'all' || p.section === activeFilter || p.regions.includes(activeFilter) || (activeFilter === 'senior' && p.regions.includes('Senior')) || (activeFilter === 'leads' && ['Lead'].includes(p.tier));
    return mQ && mF;
  });
  const services = filtered.filter(p => p.section === 'Services');
  const sales = filtered.filter(p => p.section === 'Sales');
  let html = '';
  if (!filtered.length) {
    html = '<div class="empty-state"><i class="fa-solid fa-user-slash" style="font-size:28px;margin-bottom:12px;display:block;color:rgba(0,0,0,0.2)"></i>No results. Try a different name or product.</div>';
  } else {
    if (services.length) {
      html += `<div class="section-label">Services <span class="section-count">${services.length}</span></div><div class="card-grid">` + services.map(card).join('') + '</div>';
    }
    if (sales.length) {
      html += `<div class="section-label">Sales <span class="section-count">${sales.length}</span></div><div class="card-grid">` + sales.map(card).join('') + '</div>';
    }
  }
  document.getElementById('cards-content').innerHTML = html;
}

function card(p) {
  const rTags = p.regions.filter(r => !['Other','Senior'].includes(r)).slice(0,3).map(r => `<span class="tag ${regionTagClass(r)}">${r}</span>`).join('');
  const pTags = p.products.slice(0,2).map(pr => `<span class="tag tag-product">${pr}</span>`).join('');
  const more = p.products.length > 2 ? `<span class="tag tag-more">+${p.products.length-2}</span>` : '';
  const em = email(p);
  const isSelected = selected.has(em);
  return `<div class="dir-card${isSelected ? ' selected' : ''}" id="card-${p.url}" onclick="window.open('${ecUrl(p.url)}','_blank')">
    <div class="card-check" onclick="toggleSelect('${em}', document.getElementById('card-${p.url}'), event)" title="Select for group action">
      <i class="fa-solid fa-check"></i>
    </div>
    <div class="card-top">
      ${avatarEl(p,'md')}
      <div style="min-width:0;padding-right:24px">
        <div class="card-name">${p.name}</div>
        <div class="card-role">${p.role} &middot; ${p.section}</div>
        <div class="card-links">
          <a class="card-ec" href="${ecUrl(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Employee Central <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9px"></i></a>
          <a class="card-ico" href="mailto:${em}" title="${em}" onclick="event.stopPropagation()"><i class="fa-regular fa-envelope"></i></a>
          <a class="card-ico" href="${teamsUrl(p)}" target="_blank" rel="noopener" title="Chat on Teams" onclick="event.stopPropagation()"><i class="fa-regular fa-message"></i></a>
        </div>
      </div>
    </div>
    <div class="card-tags">${rTags}${pTags}${more}</div>
  </div>`;
}

function renderOrg() {
  const leaders = people.filter(p => p.regions.includes('Senior'));
  let html = '';
  ['Services','Sales'].forEach(section => {
    html += `<div class="section-label">${section}</div>`;
    leaders.filter(p => p.section === section).forEach(leader => {
      const reports = people.filter(p => p.vp === leader.name);
      html += `<div>
        <a class="org-leader-card" href="${ecUrl(leader.url)}" target="_blank" rel="noopener">
          ${avatarEl(leader,'md')}
          <div>
            <div class="org-leader-name">${leader.name}</div>
            <div class="org-leader-title">${leader.role}</div>
            <div class="org-leader-products">${leader.products.slice(0,4).join(', ')}${leader.products.length > 4 ? '…' : ''}</div>
          </div>
        </a>`;
      if (reports.length) {
        html += `<div class="org-reports">`;
        reports.forEach(r => {
          html += `<a class="org-report-card" href="${ecUrl(r.url)}" target="_blank" rel="noopener">
            ${avatarEl(r,'sm')}
            <div>
              <div class="org-report-name">${r.name}</div>
              <div class="org-report-detail">${r.role} &middot; ${r.regions.filter(x=>!['Other','Senior'].includes(x)).join(', ')||'Shared'}</div>
            </div>
          </a>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
  });
  document.getElementById('org-content').innerHTML = html;
}

function renderMatrix() {
  function personEl(p) {
    return `<div class="matrix-person">${avatarEl(p,'xs')}<a class="matrix-link" href="${ecUrl(p.url)}" target="_blank">${p.name}</a></div>`;
  }
  let html = `<table class="matrix-table"><thead><tr>
    <th>Product</th><th>Senior leader</th><th>West</th><th>Central</th><th>Northeast</th><th>Southeast</th><th>Other / Secondary Leader</th><th>Industry Principal</th>
  </tr></thead><tbody><tr class="matrix-divider"><td colspan="8">Services</td></tr>`;
  matrixProducts.forEach(prod => {
    const m = people.filter(p => p.section === 'Services' && p.products.some(pr => pr.includes(prod)));
    html += `<tr><td>${prod}</td>`;
    html += `<td>${m.filter(p=>p.regions.includes('Senior')).map(personEl).join('')||''}</td>`;
    REGIONS.forEach(r => { html += `<td>${m.filter(p=>p.regions.includes(r)&&!p.regions.includes('Senior')&&p.tier!=='IP').map(personEl).join('')||''}</td>`; });
    html += `<td>${m.filter(p=>p.regions.includes('Other')&&p.tier!=='IP').map(personEl).join('')||''}</td>`;
    html += `<td>${m.filter(p=>p.tier==='IP').map(personEl).join('')||''}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById('matrix-content').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', render);
</script>
